<!DOCTYPE html>
<html lang="pt-BR" xmlns:th ="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonte Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
          font-family: 'Poppins', sans-serif;
          background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .login-card {
          background: #111;
          border-radius: 15px;
          padding: 40px;
          width: 100%;
          max-width: 420px;
          box-shadow: 0 0 30px rgba(128, 0, 255, 0.3);
        }

        .login-card h2 {
          color: #a855f7;
          font-weight: 600;
        }

        .form-control {
          background-color: #1c1c1c;
          border: 1px solid #333;
          color: #fff;
        }

        .form-control:focus {
          background-color: #1c1c1c;
          border-color: #a855f7;
          box-shadow: 0 0 0 0.2rem rgba(168, 85, 247, 0.25);
          color: #fff;
        }

        .btn-purple {
          background: linear-gradient(90deg, #7f00ff, #a855f7);
          border: none;
          color: #fff;
          font-weight: 500;
          transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-purple:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 20px rgba(168, 85, 247, 0.4);
        }

        .text-muted a {
          color: #a855f7;
          text-decoration: none;
        }

        .text-muted a:hover {
          text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-card">
    <h2 class="text-center mb-4">Bem-vindo</h2>

    <form method="post" th:action="@{/login}">
        <div class="mb-3">
            <label class="form-label text-light">E-mail</label>
            <input type="text" class="form-control" placeholder="Digite seu e-mail">
        </div>

        <div class="mb-3">
            <label class="form-label text-light">Senha</label>
            <input type="password" class="form-control" placeholder="Digite sua senha">
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label text-light" for="remember">
                    Lembrar-me
                </label>
            </div>
            <small class="text-muted">
                <a href="#">Esqueci a senha</a>
            </small>
        </div>

        <button type="submit" class="btn btn-purple w-100 py-2">
            Entrar
        </button>

        <p class="text-center text-muted mt-4">
            Não tem uma conta?
            <a href="#">Cadastre-se</a>
        </p>
    </form>
</div>

</body>
</html>
